<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16a34a">

  <title>Login Admin - Shae Cleaners</title>

  <link rel="stylesheet" href="admin-login.css">
</head>

<body>

  <main class="login-page">

    <div class="login-card">

      <div class="logo-box">
        <img
          src="assets/logo.png"
          alt="Shae Cleaners"
          onerror="this.style.display='none'"
        >
      </div>

      <h1>Shae Cleaners</h1>

      <p class="subtitle">
        Login Panel Admin
      </p>

      <form id="adminLoginForm">

        <label for="email">
          Email Admin
        </label>

        <input
          type="email"
          id="email"
          placeholder="Email admin"
          autocomplete="username"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
          id="loginBtn"
        >
          Masuk Admin
        </button>

      </form>

      <p
        id="loginMessage"
        class="login-message"
      ></p>

      <button
        type="button"
        class="back-btn"
        onclick="location.href='index.html'"
      >
        ← Kembali ke Website
      </button>

    </div>

  </main>

  <script
    type="module"
    src="admin-login.js"
  ></script>

</body>
</html>
