<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daftar - Shae Cleaners</title>

  <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-page">

  <div class="auth-box">

    <div class="auth-logo">
      <div class="logo-s">S</div>
      <div>
        <strong>Shae</strong>
        <span>Cleaners</span>
      </div>
    </div>

    <h2>Buat Akun</h2>
    <p class="auth-subtitle">
      Daftar untuk memudahkan pemesanan layanan
    </p>

    <form id="registerForm">

      <label>Nama Lengkap</label>
      <input
        type="text"
        id="registerName"
        placeholder="Nama lengkap"
        required
      >

      <label>No. WhatsApp</label>
      <input
        type="tel"
        id="registerPhone"
        placeholder="08xxxxxxxxxx"
        required
      >

      <label>Email</label>
      <input
        type="email"
        id="registerEmail"
        placeholder="nama@email.com"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="registerPassword"
        placeholder="Minimal 6 karakter"
        minlength="6"
        required
      >

      <button type="submit">
        Daftar
      </button>

    </form>

    <p id="registerMessage"></p>

    <div class="auth-bottom">
      Sudah punya akun?
      <a href="login.html">Login</a>
    </div>

    <a href="index.html" class="back-home">
      ← Kembali ke Beranda
    </a>

  </div>

</div>

<script src="auth.js"></script>

</body>
</html>
