<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Shae Cleaners</title>

  <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-page">

  <div class="auth-box">

    <div class="auth-logo">
      <div class="logo-s">S</div>
      <div>
        <strong>Shae</strong>
        <span>Cleaners</span>
      </div>
    </div>

    <h2>Selamat Datang</h2>

    <p class="auth-subtitle">
      Login untuk melanjutkan pemesanan
    </p>

    <form id="loginForm">

      <label>Email</label>
      <input
        type="email"
        id="loginEmail"
        placeholder="nama@email.com"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <p id="loginMessage"></p>

    <div class="auth-bottom">
      Belum punya akun?
      <a href="register.html">Daftar sekarang</a>
    </div>

    <a href="index.html" class="back-home">
      ← Kembali ke Beranda
    </a>

  </div>

</div>

<script src="auth.js"></script>

</body>
</html>
